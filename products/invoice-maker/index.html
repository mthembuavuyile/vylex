<body>

<div class="container">

  <!-- Mobile Top Bar (editor mode) -->
  <div class="mobile-top-bar">
    <h1>Invoice Generator</h1>
  </div>

  <!-- Mobile Exit Bar (preview mode) -->
  <div class="mobile-exit-bar">
    <button class="btn-back" id="back-btn">← Edit</button>
    <button class="btn-pdf" id="pdf-mobile-btn">⬇ Download PDF</button>
  </div>

  <!-- ── SIDEBAR / EDITOR ── -->
  <aside class="sidebar">
    <h1>Invoice Generator</h1>

    <p class="section-label">Style</p>
    <div class="form-row">
      <div class="form-group">
        <label>Accent Color</label>
        <input type="color" id="accent-color" value="#6a5acd">
      </div>
      <div class="form-group">
        <label>Currency</label>
        <div class="currency-pills">
          <label id="pill-usd"><input type="radio" name="currency" value="$"> <span>$ USD</span></label>
          <label id="pill-zar" class="active"><input type="radio" name="currency" value="R" checked> <span>R ZAR</span></label>
        </div>
      </div>
    </div>

    <p class="section-label">Your Details</p>
    <div class="form-group">
      <label>Company / Name</label>
      <input type="text" id="company-name" value="Vylex">
    </div>
    <div class="form-group">
      <label>Address</label>
      <textarea id="company-address" rows="2">Gauteng, 2000
South Africa</textarea>
    </div>

    <p class="section-label">Client</p>
    <div class="form-group">
      <label>Client Name</label>
      <input type="text" id="client-name" value="Avuyile Mthembu">
    </div>
    <div class="form-group">
      <label>Client Address</label>
      <textarea id="client-address" rows="2">456 Client Avenue
Durban, KZN, 4001</textarea>
    </div>

    <p class="section-label">Invoice Info</p>
    <div class="form-group">
      <label>Invoice Number</label>
      <input type="text" id="invoice-number" value="INV-2025-001">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Invoice Date</label>
        <input type="date" id="invoice-date">
      </div>
      <div class="form-group">
        <label>Due Date</label>
        <input type="date" id="due-date">
      </div>
    </div>

    <p class="section-label">Line Items</p>
    <table class="items-editor">
      <thead>
        <tr>
          <th>Description</th>
          <th style="width:110px">Amount</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="items-body"></tbody>
    </table>
    <button class="btn btn-ghost" id="add-item" style="margin-top:0.6rem">+ Add Item</button>

    <p class="section-label">Payment Details</p>
    <div class="form-group">
      <label>Bank Name</label>
      <input type="text" id="bank-name" value="Standard Bank">
    </div>
    <div class="form-group">
      <label>Account Holder</label>
      <input type="text" id="account-name" value="Vylex">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Account Number</label>
        <input type="text" id="account-number" value="10171263314">
      </div>
      <div class="form-group">
        <label>Branch Code</label>
        <input type="text" id="branch-code" value="7654">
      </div>
    </div>

    <button class="btn btn-primary" id="pdf-desktop-btn" style="margin-top:1.2rem">⬇ Download PDF</button>
  </aside>

  <!-- ── PREVIEW PANE ── -->
  <main class="preview-pane">
    <div class="invoice-preview" id="invoice-preview">
      <div class="inv-header">
        <div class="inv-company">
          <h2 id="prev-company-name">Vylex</h2>
          <p id="prev-company-addr"></p>
        </div>
        <div class="inv-title-block">
          <h2>Invoice</h2>
          <div class="inv-meta">
            <p><strong>No:</strong> <span id="prev-inv-num"></span></p>
            <p id="pw-date"><strong>Date:</strong> <span id="prev-inv-date"></span></p>
            <p id="pw-due"><strong>Due:</strong> <span id="prev-due-date"></span></p>
          </div>
        </div>
      </div>

      <div class="inv-divider"></div>

      <div class="inv-bill-section">
        <div class="inv-bill">
          <h3>Bill To</h3>
          <p id="prev-client-name"></p>
          <p id="prev-client-addr"></p>
        </div>
      </div>

      <table class="inv-table">
        <thead>
          <tr>
            <th>Description</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody id="prev-items"></tbody>
      </table>

      <div class="inv-total-row">
        <div class="inv-total-box">
          <span class="label">Total</span>
          <span class="amount"><span id="prev-currency">R</span><span id="prev-total">0.00</span></span>
        </div>
      </div>

      <div class="inv-payment" id="payment-section">
        <h4>Payment Instructions</h4>
        <div class="inv-payment-grid">
          <p id="pd-bank"><strong>Bank:</strong> <span id="prev-bank"></span></p>
          <p id="pd-ref"><strong>Reference:</strong> <span id="prev-ref"></span></p>
          <p id="pd-acname"><strong>Account Name:</strong> <span id="prev-acname"></span></p>
          <p id="pd-acnum"><strong>Account No:</strong> <span id="prev-acnum"></span></p>
          <p id="pd-branch"><strong>Branch Code:</strong> <span id="prev-branch"></span></p>
        </div>
      </div>
    </div>
  </main>

  <!-- Mobile preview button -->
  <button id="preview-btn-mobile">👁 Preview Invoice</button>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // Default dates
  const today = new Date();
  const due = new Date(); due.setDate(today.getDate() + 14);
  document.getElementById('invoice-date').valueAsDate = today;
  document.getElementById('due-date').valueAsDate = due;

  const $ = id => document.getElementById(id);
  let currency = 'R';

  const formatDate = s => s ? new Date(s).toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' }) : '';

  const updatePreview = () => {
    $('prev-company-name').textContent = $('company-name').value;
    $('prev-company-addr').innerHTML = $('company-address').value.replace(/\n/g,'<br>');
    $('prev-client-name').textContent = $('client-name').value;
    $('prev-client-addr').innerHTML = $('client-address').value.replace(/\n/g,'<br>');
    $('prev-inv-num').textContent = $('invoice-number').value;
    $('prev-ref').textContent = $('invoice-number').value;

    const invDate = $('invoice-date').value;
    $('prev-inv-date').textContent = formatDate(invDate);
    $('pw-date').style.display = invDate ? '' : 'none';

    const dueDate = $('due-date').value;
    $('prev-due-date').textContent = formatDate(dueDate);
    $('pw-due').style.display = dueDate ? '' : 'none';

    // Payment
    const bank = $('bank-name').value;
    const acname = $('account-name').value;
    const acnum = $('account-number').value;
    const branch = $('branch-code').value;
    $('prev-bank').textContent = bank;
    $('prev-acname').textContent = acname;
    $('prev-acnum').textContent = acnum;
    $('prev-branch').textContent = branch;
    $('pd-bank').style.display = bank ? '' : 'none';
    $('pd-acname').style.display = acname ? '' : 'none';
    $('pd-acnum').style.display = acnum ? '' : 'none';
    $('pd-branch').style.display = branch ? '' : 'none';
    $('payment-section').style.display = (bank || acname || acnum) ? '' : 'none';

    // Items
    let total = 0;
    $('prev-items').innerHTML = '';
    document.querySelectorAll('#items-body tr').forEach(row => {
      const desc = row.querySelector('.item-desc').value;
      const amt = parseFloat(row.querySelector('.item-amt').value) || 0;
      total += amt;
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${desc || '—'}</td><td>${currency}${amt.toFixed(2)}</td>`;
      $('prev-items').appendChild(tr);
    });

    $('prev-total').textContent = total.toFixed(2);
    $('prev-currency').textContent = currency;
  };

  const addItem = (desc='', amt='') => {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td><input type="text" class="item-desc" placeholder="Description" value="${desc}"></td>
      <td><input type="number" class="item-amt" placeholder="0.00" step="0.01" value="${amt}"></td>
      <td><button class="btn-remove" title="Remove">✕</button></td>
    `;
    $('items-body').appendChild(row);
    row.querySelectorAll('input').forEach(i => i.addEventListener('input', updatePreview));
    row.querySelector('.btn-remove').addEventListener('click', () => { row.remove(); updatePreview(); });
  };

  const generatePdf = () => {
    const el = $('invoice-preview');
    html2canvas(el, { scale: 2, useCORS: true, backgroundColor: '#ffffff' }).then(canvas => {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p','mm','a4');
      const imgData = canvas.toDataURL('image/png');
      const w = 210, h = canvas.height * w / canvas.width;
      pdf.addImage(imgData, 'PNG', 0, 0, w, h);
      pdf.save(`${$('invoice-number').value || 'Invoice'}.pdf`);
    });
  };

  // Bind inputs
  ['company-name','company-address','client-name','client-address',
   'invoice-number','invoice-date','due-date',
   'bank-name','account-name','account-number','branch-code']
    .forEach(id => $(id).addEventListener('input', updatePreview));

  $('add-item').addEventListener('click', () => addItem());
  $('pdf-desktop-btn').addEventListener('click', generatePdf);
  $('pdf-mobile-btn').addEventListener('click', generatePdf);

  // Currency pills
  document.querySelectorAll('input[name="currency"]').forEach(r => {
    r.addEventListener('change', () => {
      currency = r.value;
      document.querySelectorAll('.currency-pills label').forEach(l => l.classList.remove('active'));
      r.closest('label').classList.add('active');
      updatePreview();
    });
  });

  // Accent color
  $('accent-color').addEventListener('input', e => {
    document.documentElement.style.setProperty('--primary', e.target.value);
    // Lighten for primary-light
    document.documentElement.style.setProperty('--primary-light', e.target.value + '22');
  });

  // Mobile navigation
  $('preview-btn-mobile').addEventListener('click', () => {
    document.body.classList.add('preview-active');
    window.scrollTo(0, 0);
  });
  $('back-btn').addEventListener('click', () => {
    document.body.classList.remove('preview-active');
    window.scrollTo(0, 0);
  });

  // Init
  addItem('Mobile App Development (Android)', 6500);
  addItem('Database Maintenance & Backup', 1250);
  addItem('Domain Registration (1 Year)', 200);
  updatePreview();
});
</script>
</body>

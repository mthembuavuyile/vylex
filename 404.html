<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>404 Page Not Found | Vylex</title>
    
    <link rel="icon" href="/assets/images/favicon.ico" sizes="any">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "sans-serif"] },
            colors: {
              brand: {
                navy: "#051b38",
                lightNavy: "#0a2e5c",
                orange: "#fba919",
              },
            },
          },
        },
      };
    </script>

    <link rel="stylesheet" href="/css/global.css">
    <script src="/js/menu.js" defer></script>
</head>

<body class="bg-gray-50 text-slate-700 antialiased flex flex-col min-h-screen">

    <div id="header-placeholder"></div>

    <main class="flex-grow flex items-center justify-center pt-24 pb-12 px-4 sm:px-6 lg:px-8 bg-brand-navy relative overflow-hidden">
        <div class="absolute inset-0" style="background-image: linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px); background-size: 40px 40px;"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] bg-brand-orange/20 rounded-full blur-[100px] pointer-events-none"></div>

        <div class="text-center relative z-10 max-w-xl">
            <h1 class="text-8xl sm:text-9xl font-extrabold text-transparent bg-clip-text bg-gradient-to-br from-white to-gray-500 mb-4">
                404
            </h1>
            <h2 class="text-2xl sm:text-3xl font-bold text-white mb-4">
                System Not Found
            </h2>
            <p class="text-gray-300 mb-10 text-lg font-light">
                The endpoint you are looking for doesn't exist, has been moved, or is currently offline. 
            </p>
            
            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <a href="/" class="px-8 py-3 bg-brand-orange text-brand-navy font-bold rounded-xl hover:bg-white transition-all shadow-lg hover:-translate-y-1">
                    <i class="fa-solid fa-house mr-2"></i> Return Home
                </a>
                <a href="/services/" class="px-8 py-3 bg-white/10 text-white font-bold rounded-xl border border-white/20 hover:bg-white/20 transition-all backdrop-blur-sm">
                    View Services
                </a>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

</body>
</html>

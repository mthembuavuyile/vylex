<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Nexora AI - Smart Assistant</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg: #f0f2f7;
      --surface: #ffffff;
      --surface2: #f8f9fc;
      --border: #e2e5ef;
      --text: #14161f;
      --text-muted: #7b82a0;
      --primary: #4f6ef7;
      --primary-dark: #3452d4;
      --accent: #a259f7;
      --success: #0fb87a;
      --warn: #f5a623;
      --error: #f24545;
      --msg-user-bg: #4f6ef7;
      --msg-user-text: #ffffff;
      --msg-bot-bg: #f0f2f7;
      --msg-bot-text: #14161f;
      --shadow: 0 2px 16px rgba(79, 110, 247, 0.08);
      --shadow-lg: 0 8px 40px rgba(79, 110, 247, 0.14);
      --radius: 18px;
      --radius-sm: 10px;
      --header-h: 64px;
      --input-h: 72px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    [data-theme="dark"] {
      --bg: #0f1117;
      --surface: #1a1d28;
      --surface2: #22263a;
      --border: #2a2f45;
      --text: #eef0f9;
      --text-muted: #6b7299;
      --msg-bot-bg: #22263a;
      --msg-bot-text: #eef0f9;
      --shadow: 0 2px 16px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.4);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      height: 100dvh;
      /* dynamic viewport height for mobile */
      overflow: hidden;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      transition: background 0.3s, color 0.3s;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: var(--header-h);
      padding-top: var(--safe-top);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 20;
      position: relative;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.02em;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 0.9rem;
    }

    .header-actions {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      transition: background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-btn:active,
    .icon-btn:hover {
      background: var(--surface2);
      color: var(--text);
    }

    /* ── Layout Shell ───────────────────────────── */
    .app-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      /* critical: allows flex children to shrink */
      position: relative;
    }

    /* ── Chat Area ──────────────────────────────── */
    #chat {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    /* Scrollbar — desktop */
    #chat::-webkit-scrollbar {
      width: 4px;
    }

    #chat::-webkit-scrollbar-track {
      background: transparent;
    }

    #chat::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    /* ── Welcome Screen ─────────────────────────── */
    #welcome-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex: 1;
      min-height: 100%;
      padding: 24px 16px;
      animation: fadeUp 0.5s ease both;
    }

    #welcome-screen.hidden {
      display: none;
    }

    .welcome-orb {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: white;
      margin-bottom: 18px;
      box-shadow: 0 8px 32px rgba(79, 110, 247, 0.3);
    }

    #welcome-screen h2 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    #welcome-screen p {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      max-width: 320px;
      margin-bottom: 28px;
    }

    .suggestions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      max-width: 480px;
    }

    .suggestion-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 12px;
      text-align: left;
      cursor: pointer;
      transition: all 0.18s;
      box-shadow: var(--shadow);
      -webkit-tap-highlight-color: transparent;
    }

    .suggestion-card:active,
    .suggestion-card:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
      box-shadow: var(--shadow-lg);
    }

    .sug-icon {
      font-size: 1.3rem;
      margin-bottom: 8px;
      display: block;
    }

    .sug-title {
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 3px;
      color: var(--text);
    }

    .sug-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.3;
    }

    /* ── Messages ───────────────────────────────── */
    .message {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      animation: fadeUp 0.25s ease both;
      max-width: 100%;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.assistant {
      justify-content: flex-start;
    }

    .bot-avatar {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 0.7rem;
      flex-shrink: 0;
      align-self: flex-end;
    }

    .message-bubble {
      max-width: min(72%, 400px);
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 0.92rem;
      line-height: 1.55;
      word-break: break-word;
    }

    .message.user .message-bubble {
      background: var(--msg-user-bg);
      color: var(--msg-user-text);
      border-bottom-right-radius: 5px;
    }

    .message.assistant .message-bubble {
      background: var(--msg-bot-bg);
      color: var(--msg-bot-text);
      border-bottom-left-radius: 5px;
    }

    /* wide widgets inside assistant bubble */
    .message.assistant .message-bubble:has(.rich-widget) {
      max-width: min(92%, 520px);
      padding: 0;
      background: transparent;
    }

    /* ── Rich Widgets ───────────────────────────── */
    .rich-widget {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      width: 100%;
    }

    .widget-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .weather-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .weather-temp {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .weather-icon {
      font-size: 3rem;
      color: var(--accent);
    }

    .weather-desc {
      font-size: 0.95rem;
      font-weight: 500;
      text-transform: capitalize;
      margin-bottom: 14px;
    }

    .weather-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .weather-grid div {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* News */
    .news-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .news-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .news-thumb {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .news-item-content h4 {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 5px;
      color: var(--text);
    }

    .news-item-content a {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
    }

    .news-item-content a:hover {
      text-decoration: underline;
    }

    /* Math */
    .math-expr {
      font-family: 'DM Mono', monospace;
      background: var(--surface2);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .math-result {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--success);
      margin-top: 8px;
    }

    /* Quote */
    .quote-text {
      font-size: 1.05rem;
      font-style: italic;
      line-height: 1.6;
    }

    .rich-widget.quote-widget {
      border-left: 4px solid var(--warn);
    }

    /* Dictionary */
    .dict-word {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 2px;
    }

    .dict-phonetic {
      font-style: italic;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .dict-pos {
      display: inline-block;
      background: var(--accent);
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    .dict-defs {
      padding-left: 16px;
      line-height: 1.6;
      font-size: 0.88rem;
    }

    /* Joke */
    .joke-text {
      font-size: 1rem;
      line-height: 1.65;
    }

    /* Bible */
    .bible-ref {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .bible-text {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.95rem;
      line-height: 1.65;
      font-style: italic;
    }

    .bible-translation {
      text-align: right;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 8px;
    }

    /* Help list */
    .help-list {
      padding-left: 16px;
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 2;
    }

    /* ── Typing Indicator ───────────────────────── */
    .typing-dots {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 6px 4px;
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: boing 1.3s infinite ease-in-out both;
    }

    .typing-dot:nth-child(1) {
      animation-delay: -0.3s;
    }

    .typing-dot:nth-child(2) {
      animation-delay: -0.15s;
    }

    /* ── Scroll to bottom ───────────────────────── */
    #scroll-btn {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 38px;
      height: 38px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50%;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text);
      font-size: 0.9rem;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 10;
    }

    #scroll-btn.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* ── Input Area ─────────────────────────────── */
    .input-zone {
      flex-shrink: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 12px;
      padding-bottom: calc(10px + var(--safe-bottom));
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 24px;
      padding: 6px 6px 6px 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-row:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.12);
    }

    #input {
      flex: 1;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      line-height: 1.4;
      min-height: 36px;
      resize: none;
    }

    #input::placeholder {
      color: var(--text-muted);
    }

    .input-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    #mic-btn {
      width: 34px;
      height: 34px;
      border: none;
      background: transparent;
      border-radius: 50%;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    #mic-btn.listening {
      background: var(--error);
      color: white;
      animation: pulse 1.5s infinite;
    }

    #send-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: var(--primary);
      border-radius: 50%;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    #send-btn:active {
      transform: scale(0.93);
    }

    #send-btn:hover {
      background: var(--primary-dark);
    }

    .footer-note {
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* ── Settings Panel ─────────────────────────── */
    #backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
      z-index: 80;
    }

    #backdrop.show {
      opacity: 1;
      visibility: visible;
    }

    #settings-panel {
      position: fixed;
      top: 0;
      right: -340px;
      width: 320px;
      height: 100%;
      height: 100dvh;
      background: var(--surface);
      border-left: 1px solid var(--border);
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #settings-panel.open {
      right: 0;
    }

    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .settings-header h2 {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .settings-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .s-section h3 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .theme-row {
      display: flex;
      gap: 8px;
    }

    .theme-opt {
      flex: 1;
      padding: 8px;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.85rem;
      font-family: inherit;
      font-weight: 500;
      transition: all 0.15s;
    }

    .theme-opt.active {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(79, 110, 247, 0.08);
    }

    .s-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      margin-bottom: 5px;
      color: var(--text);
    }

    .s-select,
    .s-range {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      margin-bottom: 12px;
      outline: none;
    }

    .s-select:focus {
      border-color: var(--primary);
    }

    .s-range {
      padding: 4px 0;
      border: none;
      background: none;
      accent-color: var(--primary);
    }

    .s-check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .btn-danger {
      width: 100%;
      padding: 10px;
      background: var(--error);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.15s;
    }

    .btn-danger:active {
      opacity: 0.8;
    }

    /* ── Animations ─────────────────────────────── */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes boing {

      0%,
      80%,
      100% {
        transform: scale(0);
      }

      40% {
        transform: scale(1);
      }
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(242, 69, 69, 0.6);
      }

      70% {
        box-shadow: 0 0 0 8px rgba(242, 69, 69, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(242, 69, 69, 0);
      }
    }

    /* ── Mobile tweaks ──────────────────────────── */
    @media (max-width: 480px) {
      #settings-panel {
        width: 100%;
        right: -100%;
      }

      .message-bubble {
        max-width: 84%;
      }

      .message.assistant .message-bubble:has(.rich-widget) {
        max-width: 96%;
      }

      .suggestions-grid {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .weather-temp {
        font-size: 2.2rem;
      }
    }

    /* Desktop refinement */
    @media (min-width: 700px) {
      .app-body {
        max-width: 720px;
        margin: 0 auto;
        width: 100%;
      }

      body {
        align-items: center;
      }

      .header {
        max-width: 720px;
        width: 100%;
      }

      .message-bubble {
        max-width: 60%;
      }
    }
  </style>
</head>

<body data-theme="light">

  <header class="header">
    <div class="logo">
      <div class="logo-icon"><i class="fas fa-layer-group"></i></div>
      Nexora AI
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="clear-btn" title="New Chat" aria-label="New Chat">
        <i class="fas fa-pen-to-square"></i>
      </button>
      <button class="icon-btn" id="settings-btn" title="Settings" aria-label="Settings">
        <i class="fas fa-cog"></i>
      </button>
    </div>
  </header>

  <div class="app-body">
    <div id="chat" role="log" aria-live="polite" aria-label="Chat messages">
      <div id="welcome-screen">
        <div class="welcome-orb"><i class="fas fa-layer-group"></i></div>
        <h2>How can I help you?</h2>
        <p>Ask me about weather, news, math, definitions, quotes, and more.</p>
        <div class="suggestions-grid">
    <button class="suggestion-card" onclick="sendSuggestion('Weather in Durban')">
        <span class="sug-icon">🌤️</span>
        <div class="sug-title">Weather</div>

      <i class="fas fa-arrow-down"></i>

            <button type="button" id="mic-btn" aria-label="Voice input">
              <i class="fas fa-microphone"></i>

  <!-- Settings -->
  <div id="backdrop"></div>
  <aside id="settings-panel" aria-label="Settings">
    <div class="settings-header">
      <h2>Settings</h2>
      <button class="icon-btn" id="close-settings" aria-label="Close settings">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="settings-body">
      <div class="s-section">
        <h3>Appearance</h3>
        <div class="theme-row">
          <button class="theme-opt active" data-theme="light"><i class="fas fa-sun"></i> Light</button>
          <button class="theme-opt" data-theme="dark"><i class="fas fa-moon"></i> Dark</button>
        </div>
      </div>
      <div class="s-section">
        <h3>Voice & Speech</h3>
        <label class="s-check">
          <input type="checkbox" id="tts-enabled"> Read responses aloud
        </label>
        <br>
        <label class="s-label" for="voice-select">Voice</label>
        <select class="s-select" id="voice-select"></select>
        <label class="s-label">Speed: <span id="rate-val">1.0</span></label>
        <input type="range" class="s-range" id="voice-rate" min="0.5" max="2" step="0.1" value="1.0">
        <label class="s-label">Pitch: <span id="pitch-val">1.0</span></label>
        <input type="range" class="s-range" id="voice-pitch" min="0.5" max="2" step="0.1" value="1.0">
      </div>
      <div class="s-section">
        <h3>Preferences</h3>
        <label class="s-label" for="weather-units">Weather Units</label>
        <select class="s-select" id="weather-units">
          <option value="metric">Celsius (°C)</option>
          <option value="imperial">Fahrenheit (°F)</option>
        </select>
        <label class="s-label" for="bible-version">Bible Translation</label>
        <select class="s-select" id="bible-version">
          <option value="kjv">KJV</option>
          <option value="web">WEB</option>
        </select>
      </div>
      <div class="s-section">
        <button class="btn-danger" id="reset-settings">
          <i class="fas fa-trash-alt"></i> Reset All Settings
        </button>
      </div>
    </div>
  </aside>

  <script src="js/app.js">
  </script>
</body>

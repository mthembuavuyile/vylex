<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary SEO -->
    <title>Vylex Writer | Free Browser Text Editor — No Login, No Distractions</title>
    <meta name="title" content="Vylex Writer | Free Browser Text Editor — No Login, No Distractions">
    <meta name="description" content="Write without friction. Vylex Writer is a free, privacy-first text editor that runs entirely in your browser — no login, no cloud, no bloat. Dark mode, word count, and PDF export included.">
    <meta name="keywords" content="browser text editor no login, local storage notepad, distraction free writing tool, privacy first text editor, online notepad no account, dark mode writing app, free word counter online, offline text editor browser">
    <meta name="author" content="Avuyile Mthembu">
    <meta name="robots" content="index, follow">

    <!-- Theme / App Identity -->
    <meta name="theme-color" content="#0a0a0a">
    <meta name="application-name" content="Vylex Writer">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://vylex.co.za/portfolio/writer">
    <meta property="og:title" content="No Login. No Cloud. Just Your Words.">
    <meta property="og:description" content="Vylex Writer is a free, local-first text editor built for focus — with dark mode, PDF export, and zero tracking.">
    <meta property="og:image" content="https://vylex.co.za/assets/Writer-preview.jpg">
    <meta property="og:site_name" content="Vylex IT Solutions">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://vylex.co.za/portfolio/writer">
    <meta property="twitter:title" content="Vylex Writer | No Login Text Editor">
    <meta property="twitter:description" content="Free browser-based writing tool. No login, no cloud, just focus.">
    <meta property="twitter:image" content="https://vylex.co.za/assets/Writer-preview.jpg">

    <!-- Canonical -->
    <link rel="canonical" href="https://vylex.co.za/portfolio/writer">

    <!-- Favicon -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- Styles -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Vylex Writer",
      "applicationCategory": "ProductivityApplication",
      "operatingSystem": "Web Browser",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "ZAR" },
      "description": "A free, privacy-first, distraction-free text editor. No login required.",
      "url": "https://vylex.co.za/portfolio/writer",
      "author": { "@type": "Person", "name": "Avuyile Mthembu" }
    }
    </script>
</head>

<body>
    <div class="header">
        <div class="header-left">
            <div class="logo">
                <div class="logo-icon">L</div>
                <span>Vylex Writer</span>
            </div>
            <button class="action-btn" id="saveBtn"><i class="fas fa-save"></i> Save</button>
            <button class="action-btn" id="exportPdfBtn"><i class="fas fa-file-pdf"></i> Export PDF</button>
        </div>
        <div class="header-right">
            <div class="word-counter" id="wordCounter">0 words, 0 characters</div>
            <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
        </div>
    </div>

    <div class="toolbar">
        <button class="toolbar-btn" id="boldBtn"><i class="fas fa-bold"></i></button>
        <button class="toolbar-btn" id="italicBtn"><i class="fas fa-italic"></i></button>
        <button class="toolbar-btn" id="underlineBtn"><i class="fas fa-underline"></i></button>
        <button class="toolbar-btn" id="strikeBtn"><i class="fas fa-strikethrough"></i></button>
        <button class="toolbar-btn" id="alignLeftBtn"><i class="fas fa-align-left"></i></button>
        <button class="toolbar-btn" id="alignCenterBtn"><i class="fas fa-align-center"></i></button>
        <button class="toolbar-btn" id="alignRightBtn"><i class="fas fa-align-right"></i></button>
        <button class="toolbar-btn" id="listBtn"><i class="fas fa-list-ul"></i></button>
        <button class="toolbar-btn" id="numberListBtn"><i class="fas fa-list-ol"></i></button>
        <button class="toolbar-btn" id="linkBtn"><i class="fas fa-link"></i></button>
        <button class="toolbar-btn" id="clearFormatBtn"><i class="fas fa-eraser"></i></button>

        <select class="toolbar-select" id="fontFamily">
            <option value="inherit">Font Family</option>
            <option value="Arial">Arial</option>
            <option value="Helvetica">Helvetica</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Courier New">Courier New</option>
            <option value="Georgia">Georgia</option>
            <option value="Verdana">Verdana</option>
        </select>

        <select class="toolbar-select" id="fontSize">
            <option value="">Font Size</option>
            <option value="1">Very Small</option>
            <option value="2">Small</option>
            <option value="3">Normal</option>
            <option value="4">Medium</option>
            <option value="5">Large</option>
            <option value="6">Very Large</option>
            <option value="7">Extra Large</option>
        </select>
    </div>

    <div class="tab-bar" id="tabBar">
        <button class="tab-add" id="addTabBtn" title="New note (Ctrl+Shift+N)">
            <i class="fas fa-plus"></i>
        </button>
    </div>

    <div class="container">
        <div id="editor" contenteditable="true"></div>
    </div>

    <div class="alert" id="alertMessage"></div>

    <!-- Include html2pdf.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script src="app.js"></script>
</body>

</html>
